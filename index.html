<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Trench Crusade - Warband Forge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    :root {
      --bg: #111;
      --rust: #5c3a21;
      --rust-dark: #2a1610;
      --gold: #b8863c;
      --parchment: #e2d4b7;
      --parchment-dim: #9e9178;
      --font-display: "Times New Roman", serif;
      --font-ui: "Helvetica Neue", sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--parchment);
      font-family: var(--font-ui);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: linear-gradient(rgba(17,17,17,0.9), rgba(17,17,17,0.9)), url('assets/wwi-placeholders/bg.jpg');
      background-size: cover;
      background-position: center;
    }
    header {
      width: 100%;
      padding: 2rem;
      text-align: center;
      border-bottom: 1px solid var(--rust);
      background: rgba(0,0,0,0.5);
      position: relative;
    }
    h1 {
      font-family: var(--font-display);
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 0;
      font-size: 2.5rem;
    }
    .subtitle {
      color: var(--parchment-dim);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      display: block;
      margin-top: 0.5rem;
    }
    .settings-btn {
      position: absolute;
      top: 2rem;
      right: 2rem;
      background: none;
      border: 1px solid var(--rust);
      color: var(--gold);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .settings-btn:hover {
      background: var(--rust);
      color: var(--parchment);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      width: 100%;
      max-width: 900px;
      padding: 4rem 2rem;
      box-sizing: border-box;
    }
    .card {
      background: var(--rust-dark);
      border: 1px solid var(--rust);
      border-radius: 4px;
      padding: 3rem 1.5rem;
      text-align: center;
      text-decoration: none;
      color: var(--gold);
      font-family: var(--font-display);
      text-transform: uppercase;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .card:hover {
      background: var(--rust);
      color: var(--parchment);
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.6);
      border-color: var(--gold);
    }
    .card-icon {
      font-size: 3.5rem;
      opacity: 0.9;
    }
    .card-title {
      font-size: 1.8rem;
      margin: 0;
    }
    .card-desc {
      font-family: var(--font-ui);
      font-size: 0.95rem;
      color: var(--parchment-dim);
      text-transform: none;
      letter-spacing: normal;
    }
  </style>
</head>
<body>
  <header>
    <h1>WARBAND FORGE</h1>
    <span class="subtitle">Trench Crusade</span>
    <button class="settings-btn" onclick="window.location.href='app.html?mode=banda&settings=1'" title="Configuración">⚙</button>
  </header>
  
  <div class="grid">
    <a href="app.html?mode=banda" class="card">
      <span class="card-icon">⚔</span>
      <h2 class="card-title">Bandas</h2>
      <span class="card-desc">Crear, importar y gestionar tus warbands</span>
    </a>
    <a href="app.html?mode=campana" class="card">
      <span class="card-icon">📚</span>
      <h2 class="card-title">Campañas</h2>
      <span class="card-desc">Juega crónicas narrativas y progresión</span>
    </a>
    <a href="app.html?mode=lab" class="card">
      <span class="card-icon">🔬</span>
      <h2 class="card-title">Lab</h2>
      <span class="card-desc">Simula batallas y cruza estadísticas</span>
    </a>
    <a href="app.html?mode=battle" class="card">
      <span class="card-icon">📋</span>
      <h2 class="card-title">Partida</h2>
      <span class="card-desc">Juega una partida sin afectar a campañas</span>
    </a>
  </div>
</body>
</html>
